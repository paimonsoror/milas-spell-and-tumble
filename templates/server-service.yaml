{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "milas-spell-and-tumble.fullname" . }}-server
  labels:
    {{- include "milas-spell-and-tumble.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "milas-spell-and-tumble.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sync-server
{{- end }}
