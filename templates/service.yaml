apiVersion: v1
kind: Service
metadata:
  name: {{ include "milas-spell-and-tumble.fullname" . }}
  labels:
    {{- include "milas-spell-and-tumble.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "milas-spell-and-tumble.selectorLabels" . | nindent 4 }}
