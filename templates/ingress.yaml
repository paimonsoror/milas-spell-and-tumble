{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "milas-spell-and-tumble.fullname" . }}
  labels:
    {{- include "milas-spell-and-tumble.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- /* each path defaults to the main static site; set
                       service:/port: on a path entry to route it elsewhere,
                       e.g. the sync API at /api (see values.yaml). */}}
                {{- if eq .service "server" }}
                name: {{ include "milas-spell-and-tumble.fullname" $ }}-server
                port:
                  number: {{ .port | default $.Values.server.port }}
                {{- else }}
                name: {{ include "milas-spell-and-tumble.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
