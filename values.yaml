replicaCount: 1

image:
  repository: ghcr.io/paimonsoror/milas-spell-and-tumble
  tag: latest
  pullPolicy: Always

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spelltumble.example.com
      paths:
        - path: "/"
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
