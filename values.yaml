replicaCount: 1

image:
  repository: ghcr.io/paimonsoror/milas-spell-and-tumble
  tag: "cd27cc4ec5fc9d9d5e21373b483933f683e0a4e2"
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: spelltumble.example.com
      paths:
        # "service"/"port" are optional per path — default to the main static
        # site above. The sync API gets routed here on the same host/cert,
        # no new hostname or DNS record needed.
        - path: "/"
          pathType: Prefix
        - path: "/api"
          pathType: Prefix
          service: server
          port: 8081
        - path: "/admin"
          pathType: Prefix
          service: server
          port: 8081
  tls: []

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

# The cross-device sync backend — see HANDOFF-ARCHITECTURE.md. Deliberately
# tiny: no npm dependencies (node:http + node:sqlite only), 1 replica (SQLite
# is single-writer), a small PVC for its one database file.
server:
  enabled: true
  image:
    repository: ghcr.io/paimonsoror/milas-spell-and-tumble-server
    tag: "cd27cc4ec5fc9d9d5e21373b483933f683e0a4e2"
    pullPolicy: IfNotPresent
  port: 8081
  persistence:
    size: 256Mi
  # Gates the hidden /admin operator page (server/admin.html). Left blank by
  # default so the page stays disabled until a real secret is wired up — the
  # password itself lives in a Kubernetes Secret created directly on the
  # cluster, never in this file or git. See CLAUDE.md.
  adminPasswordSecretName: ""
  adminPasswordSecretKey: "password"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
