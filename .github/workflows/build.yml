name: Build and push images

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/milas-spell-and-tumble
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/milas-spell-and-tumble-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build tooling
        run: npm ci

      # Runs the same esbuild bundle the Docker build stage produces, plus
      # tests/check.js against it — a broken bundle or a real regression in
      # js/*.js is caught here, before either image gets pushed. This is the
      # first test coverage this workflow has ever had (it previously went
      # straight from checkout to docker build-push-action).
      - name: Build and test the frontend bundle
        run: |
          npm run build
          npm test

      # Type-checking pass via JSDoc + tsconfig's checkJs, not a TypeScript
      # rewrite. Deliberately non-blocking for now (`|| true`) — this is a
      # first pass over 6,300 untyped lines, so it's expected to be noisy;
      # tighten `strict` and make this blocking once real coverage exists.
      - name: Type-check (report only)
        run: npm run typecheck || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the game image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build and push the sync server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:latest
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}

      # GitOps reproducibility only holds if what's deployed matches what's in
      # git. ":latest" + "Always" meant a pod restart for any reason could
      # silently run a different build than the last ArgoCD sync — this pins
      # both images to this build's immutable sha and commits that back, so
      # the chart in git is always the source of truth for what actually runs.
      - name: Pin the Helm chart to this build's immutable tags
        run: |
          # matches "tag: latest" on the first-ever run and "tag: \"<prior sha>\"" on
          # every run after, so this stays idempotent regardless of what's currently pinned
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/g; s/pullPolicy: Always/pullPolicy: IfNotPresent/g' values.yaml
          if ! git diff --quiet -- values.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add values.yaml
            git commit -m "Pin deployed image tags to ${{ github.sha }} [skip ci]"
            git push
          fi
